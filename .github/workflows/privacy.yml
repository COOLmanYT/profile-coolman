name: Privacy enforcement
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run privacy:check
      - run: node --test tests/privacy-enforcement.test.mjs tests/privacy-wiring.test.mjs
